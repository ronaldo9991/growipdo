<div id="app" data-run="{{run_id}}">
  <div class="page-head in">
    <div>
      <div class="crumb"><a href="/diagnostic">Track B</a> / run <span class="mono">{{run_id}}</span></div>
      <h1 id="subject">Identifying subject</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="actions">
      <span class="chip" id="statusChip">created</span>
      <a class="btn" id="draftLink" href="/runs/{{run_id}}/draft" hidden>Review draft</a>
      <a class="btn" href="/runs/{{run_id}}/diagnostic.md" id="mdLink" hidden>diagnostic.md</a>
      <a class="btn" href="/runs/{{run_id}}/ledger.json" target="_blank" rel="noopener">ledger.json</a>
    </div>
  </div>
  <div class="stages" id="stages"></div>
  <div class="stats" id="stats"></div>
  <div class="err" id="runError"></div>
  <div class="cols">
    <div class="stack">
      <div class="card" id="summaryCard" hidden><h2>Summary</h2><div id="summary" class="doc"></div></div>
      <div class="card" id="gapsCard" hidden><h2>Three biggest gaps</h2><div id="gaps"></div></div>
      <div class="card" id="findingsCard" hidden><h2>Findings ledger</h2><div class="tabs" id="tabs"></div><div id="findings"></div></div>
      <div class="card"><h2>Log</h2><div class="log" id="log"></div></div>
    </div>
    <div class="stack">
      <div class="card gate" id="gate"></div>
      <div class="card" id="sourcesCard"><h2>Sources</h2><div id="sources" class="empty">Nothing fetched yet.</div></div>
    </div>
  </div>
</div>
