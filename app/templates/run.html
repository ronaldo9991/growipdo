<div id="app" data-run="{{run_id}}">
  <div class="page-head in">
    <div>
      <div class="crumb"><a href="/diagnostic">Track B</a> / run <span class="mono">{{run_id}}</span></div>
      <h1 id="subject">Identifying subject</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="actions">
      <span class="chip" id="statusChip">created</span>
      <a class="btn" id="draftLink" href="/runs/{{run_id}}/draft" hidden>Full page view</a>
      <details class="files"><summary class="btn">Files</summary><div class="menu">
        <a href="/runs/{{run_id}}/diagnostic.md" id="mdLink" hidden>diagnostic.md</a>
        <a href="/runs/{{run_id}}/ledger.json" target="_blank" rel="noopener">ledger.json</a>
        <a href="/runs/{{run_id}}/evidence.zip">evidence.zip</a>
      </div></details>
    </div>
  </div>
  <div class="stages" id="stages"></div>
  <div class="progress" id="progress" aria-live="polite"></div>
  <div class="verdict" id="verdict"></div>
  <div class="err" id="runError"></div>
  <div class="cols">
    <div class="stack">
      <nav class="sectabs" id="sectabs" aria-label="Sections"></nav>
      <div class="card sec" data-sec="diagnostic" id="diagnosticSec"><div class="doc" id="doc"><span class="spin"></span>Waiting for the draft</div></div>
      <div class="card sec" data-sec="findings" id="findingsSec" hidden><div class="tabs" id="tabs"></div><div id="findings"></div></div>
      <div class="card sec" data-sec="sources" id="sourcesSec" hidden><div id="sources" class="empty">Nothing fetched yet.</div></div>
      <div class="card sec" data-sec="log" id="logSec" hidden><div class="log" id="log"></div></div>
    </div>
    <div class="stack">
      <div class="card gate" id="gate"></div>
    </div>
  </div>
</div>
