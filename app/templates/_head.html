<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
</head>
<body data-track="{{track}}">
<div class="orb a"></div><div class="orb b"></div>
<div class="wrap">
<header class="top">
  <a class="brand" href="/"><span class="dot"></span><span>Growpido Task<small>Public record, human gated</small></span></a>
  <div class="toggle" role="tablist" aria-label="Track" data-toggle="nav">
    <span class="ind" aria-hidden="true"></span>
    <a href="/radar" class="seg" data-seg="a" role="tab">Track A · Radar</a>
    <a href="/diagnostic" class="seg" data-seg="b" role="tab">Track B · Diagnostic</a>
  </div>
  <nav><a href="https://github.com/ronaldo9991/growipdo" target="_blank" rel="noopener">Source</a>
    <button type="button" class="theme" id="themeBtn" aria-label="Switch colour theme" title="Switch colour theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button></nav>
</header>
