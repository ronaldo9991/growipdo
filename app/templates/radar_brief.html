<div id="app" data-run="{{run_id}}" data-kind="radar">
  <div class="page-head in">
    <div>
      <div class="crumb"><a href="/radar">Track A</a> / <a href="/radar/runs/{{run_id}}">run <span class="mono">{{run_id}}</span></a> / brief</div>
      <h1 id="subject">Weekly brief</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="actions">
      <span class="chip" id="statusChip"></span>
      <a class="btn" href="/radar/runs/{{run_id}}">Run detail</a>
      <a class="btn" href="/radar/runs/{{run_id}}/brief.md">brief.md</a>
    </div>
  </div>
  <div class="cols">
    <div class="card"><div class="doc" id="doc"><span class="spin"></span>Loading</div></div>
    <div class="stack">
      <div class="card gate" id="gate"></div>
      <div class="card" id="warnCard" hidden><h2>House rules warnings</h2><ul class="warnlist" id="warns"></ul></div>
    </div>
  </div>
</div>
