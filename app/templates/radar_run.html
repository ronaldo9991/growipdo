<div id="app" data-run="{{run_id}}" data-kind="radar">
  <div class="page-head in">
    <div>
      <div class="crumb"><a href="/radar">Track A</a> / run <span class="mono">{{run_id}}</span></div>
      <h1 id="subject">Profiling subjects</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="actions">
      <span class="chip" id="statusChip">created</span>
      <a class="btn" id="briefLink" href="/radar/runs/{{run_id}}/brief" hidden>Full page view</a>
      <details class="files"><summary class="btn">Files</summary><div class="menu">
        <a href="/radar/runs/{{run_id}}/brief.md" id="mdLink" hidden>brief.md</a>
        <a href="/radar/runs/{{run_id}}/ledger.json" target="_blank" rel="noopener">ledger.json</a>
        <a href="/radar/runs/{{run_id}}/evidence.zip">evidence.zip</a>
      </div></details>
    </div>
  </div>
  <div class="stages" id="stages"></div>
  <div class="progress" id="progress" aria-live="polite"></div>
  <div class="verdict" id="verdict"></div>
  <div class="err" id="runError"></div>
  <div class="cols">
    <div class="stack">
      <nav class="sectabs" id="sectabs" aria-label="Sections"></nav>
      <div class="card sec" data-sec="queue" id="queueSec">
        <div id="queue" class="empty">Nothing is waiting for you.</div>
      </div>
      <div class="card sec" data-sec="brief" id="briefSec" hidden><div class="doc" id="doc"><span class="spin"></span>Waiting for the brief</div></div>
      <div class="card sec" data-sec="mentions" id="mentionsSec" hidden><div class="tabs" id="tabs"></div><div id="mentions"></div></div>
      <div class="card sec" data-sec="log" id="logSec" hidden><div class="log" id="log"></div></div>
    </div>
    <div class="stack">
      <div class="card gate" id="gate"></div>
      <div class="card" id="profileCard" hidden><h2>Subject profile</h2><div id="profile" class="hint"></div></div>
    </div>
  </div>
</div>
