<div id="app" data-run="{{run_id}}">
  <div class="head fade">
    <div>
      <div class="kicker" style="color:var(--ink-3)">Review draft, run {{run_id}}</div>
      <h1 id="subject">Diagnostic</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="actions">
      <span class="chip plain" id="statusChip"></span>
      <a class="btn" href="/runs/{{run_id}}">Run detail</a>
      <a class="btn" href="/runs/{{run_id}}/diagnostic.md">diagnostic.md</a>
    </div>
  </div>
  <div class="cols">
    <div class="card"><div class="doc" id="doc"><span class="spin"></span>Loading</div></div>
    <div class="stack">
      <div class="card gate" id="gate"></div>
      <div class="card" id="warnCard" hidden><h2>House rules warnings</h2><ul class="warnlist" id="warns"></ul></div>
    </div>
  </div>
</div>
